name: Release Rank Wars Add-on

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package add-on ZIP
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          .\package.ps1 -Version $tag

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/UNI2-RankWars-*.zip
          generate_release_notes: true
